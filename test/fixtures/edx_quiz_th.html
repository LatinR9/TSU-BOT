<!DOCTYPE html>
<html lang="th">
<head><meta charset="utf-8"><title>บทที่ 1 อัตลักษณ์มหาวิทยาลัยทักษิณ</title></head>
<body>
<h2 class="unit-title">แบบทดสอบ บทที่ 1 อัตลักษณ์มหาวิทยาลัยทักษิณ</h2>
<div class="vert-mod">
  <div class="vert vert-0">
    <div class="xblock xblock-student_view xblock-student_view-problem" data-block-type="problem">
      <div class="problems-wrapper">
        <h3 class="hd hd-3 problem-header">ข้อที่ 1</h3>
        <div class="problem-progress">1 point possible (graded)</div>
        <div class="problem">
          <div>
            <div class="wrapper-problem-response" role="group">
              <div class="choicegroup capa_inputtype">
                <fieldset>
                  <!-- zero-width space + NBSP as commonly pasted into Thai course content -->
                  <legend class="response-fieldset-legend field-group-hd">สีประจำ&#8203;มหาวิทยาลัยทักษิณ&nbsp;คือสีอะไร</legend>
                  <div class="field">
                    <input type="radio" name="input_t1" id="input_t1_choice_0" value="choice_0">
                    <label for="input_t1_choice_0" class="response-label field-label label-inline">ฟ้า-ขาว</label>
                  </div>
                  <div class="field">
                    <input type="radio" name="input_t1" id="input_t1_choice_1" value="choice_1">
                    <label for="input_t1_choice_1" class="response-label field-label label-inline">แดง-เหลือง</label>
                  </div>
                  <div class="field">
                    <input type="radio" name="input_t1" id="input_t1_choice_2" value="choice_2">
                    <label for="input_t1_choice_2" class="response-label field-label label-inline">เทา–ฟ้า</label>
                  </div>
                </fieldset>
              </div>
            </div>
          </div>
          <div class="action">
            <button type="button" class="submit btn-brand" data-value="Submit" onclick="window.__submitted = (window.__submitted || 0) + 1"><span class="submit-label">ส่งคำตอบ</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="vert vert-1">
    <div class="xblock xblock-student_view xblock-student_view-problem" data-block-type="problem">
      <div class="problems-wrapper">
        <h3 class="hd hd-3 problem-header">ข้อที่ 2</h3>
        <div class="problem-progress">1 point possible (graded)</div>
        <div class="problem">
          <div>
            <div class="wrapper-problem-response" role="group">
              <div class="choicegroup capa_inputtype">
                <fieldset>
                  <legend class="response-fieldset-legend field-group-hd">ต้นไม้และดอกไม้ประจำมหาวิทยาลัยทักษิณคือต้นอะไร</legend>
                  <div class="field">
                    <input type="radio" name="input_t2" id="input_t2_choice_0" value="choice_0">
                    <label for="input_t2_choice_0" class="response-label field-label label-inline">ต้นราชพฤกษ์</label>
                  </div>
                  <div class="field">
                    <input type="radio" name="input_t2" id="input_t2_choice_1" value="choice_1">
                    <label for="input_t2_choice_1" class="response-label field-label label-inline">ต้นทองหลาง</label>
                  </div>
                  <div class="field">
                    <input type="radio" name="input_t2" id="input_t2_choice_2" value="choice_2">
                    <label for="input_t2_choice_2" class="response-label field-label label-inline">ต้นสัก</label>
                  </div>
                </fieldset>
              </div>
            </div>
          </div>
          <div class="action">
            <button type="button" class="submit btn-brand" data-value="Submit" onclick="window.__submitted = (window.__submitted || 0) + 1"><span class="submit-label">ส่งคำตอบ</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="vert vert-2">
    <div class="xblock xblock-student_view xblock-student_view-problem" data-block-type="problem">
      <div class="problems-wrapper">
        <h3 class="hd hd-3 problem-header">ข้อที่ 3</h3>
        <div class="problem">
          <div>
            <div class="wrapper-problem-response" role="group">
              <div class="choicegroup capa_inputtype">
                <fieldset>
                  <legend class="response-fieldset-legend field-group-hd">คำถามที่ไม่มีอยู่ในฐานข้อมูลคำตอบเลยแม้แต่น้อย</legend>
                  <div class="field">
                    <input type="radio" name="input_t3" id="input_t3_choice_0" value="choice_0">
                    <label for="input_t3_choice_0" class="response-label field-label label-inline">ตัวเลือกหนึ่ง</label>
                  </div>
                  <div class="field">
                    <input type="radio" name="input_t3" id="input_t3_choice_1" value="choice_1">
                    <label for="input_t3_choice_1" class="response-label field-label label-inline">ตัวเลือกสอง</label>
                  </div>
                </fieldset>
              </div>
            </div>
          </div>
          <div class="action">
            <button type="button" class="submit btn-brand" data-value="Submit" onclick="window.__submitted = (window.__submitted || 0) + 1"><span class="submit-label">ส่งคำตอบ</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
